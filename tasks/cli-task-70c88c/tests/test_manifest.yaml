version: '1.0'
gates:
- id: build_succeeds
  kind: P2P
  command: python3 /tests/verify_behavior.py --gate build_succeeds
  weight: 0
  description: The CLI builds from the submitted source.
- id: existing_tests_pass
  kind: P2P
  command: python3 /tests/verify_behavior.py --gate existing_tests_pass
  weight: 0
  description: Existing explain package tests still pass.
- id: help_flag_works
  kind: P2P
  command: python3 /tests/verify_behavior.py --gate help_flag_works
  weight: 0
  description: Plain --help still shows normal usage.
- id: flags_intact
  kind: P2P
  command: python3 /tests/verify_behavior.py --gate flags_intact
  weight: 0
  description: Normal help still lists all qualifier flags.
- id: positional_shows_help
  kind: F2P
  command: python3 /tests/verify_behavior.py --gate positional_shows_help
  weight: 0.5
  description: A bare positional argument shows help while a qualified argument does not.
- id: help_mentions_qualifier
  kind: F2P
  command: python3 /tests/verify_behavior.py --gate help_mentions_qualifier
  weight: 0.3
  description: The shown help lists the qualifier flags.
- id: stderr_hint
  kind: F2P
  command: python3 /tests/verify_behavior.py --gate stderr_hint
  weight: 0.2
  description: Only a bare positional argument emits a Hint on stderr.
